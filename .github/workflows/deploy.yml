name: Deploy to QuSciTech (SFTP) + Smoke Test

on:
  push:
    branches: [ main ]
    paths:
      - 'public_html/**'
      - 'public/**'
      - 'tools/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

env:
  WEB_HOSTNAME: quscitech.com
  SMOKE_PATH: instructors/QST-INST-2025/resources/hello-ci.html

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧰 Checkout
        uses: actions/checkout@v4

      # Build the smoke marker inside the web tree
      - name: 📝 Ensure smoke-test file exists (PUBLIC)
        run: |
          set -e
          WEB_ROOT="public_html/instructors/QST-INST-2025/resources"
          mkdir -p "$WEB_ROOT"
          [ -f "$WEB_ROOT/hello-ci.html" ] || cat > "$WEB_ROOT/hello-ci.html" <<'HTML'
          <!doctype html><meta charset="utf-8">
          <title>QuSciTech CI Smoke Test</title>
          <h1>✅ CI/CD is working (PUBLIC)</h1>
          <p>Built at: $(date -u)</p>
          HTML
          echo "---- DIAG: list under resources ----"
          ls -lah "$WEB_ROOT" || true

      # Copy ALL repo labs into the web-ready tree (so we deploy complete folders)
      - name: 🔁 Sync repo labs into web tree
        run: |
          set -e
          SRC="public/labs/"
          DST="public_html/instructors/QST-INST-2025/resources/labs/"
          mkdir -p "$DST"
          rsync -a --delete "$SRC" "$DST"
          echo "Synced $(find "$DST" -maxdepth 1 -mindepth 1 -type d | wc -l) labs into $DST"
          # Add/refresh the flat-layout README if you keep it in the repo
          if [ -f public_html/instructors/QST-INST-2025/resources/labs/README.md ]; then
            echo "Labs README present."
          fi

      - name: 🔎 Probe SFTP port 22 (non-blocking)
        run: |
          set -e
          HOST="${{ secrets.SFTP_HOST_PUBLIC }}"
          echo "Probing $HOST:22 ..."
          if timeout 10 bash -lc "cat < /dev/tcp/$HOST/22"; then
            echo "✅ Port 22 reachable"
          else
            echo "::warning ::❌ Port 22 NOT reachable (will attempt upload anyway)"
          fi

      # Prepare target and ensure qadmin owns it so SFTP can write
      - name: 🧱 Prepare public target (mkdir + chown for qadmin)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_HOST_PUBLIC }}                 # qram.quscitech.com
          username: ${{ secrets.SSH_USER_ROOT_PUBLIC }}         # root
          password: ${{ secrets.SSH_PASSWORD_ROOT_PUBLIC }}
          port: 22
          script: |
            set -euo pipefail
            BASE="/home/quscitech/public_html/instructors/QST-INST-2025"
            WEB="$BASE/resources"

            # Create expected structure
            mkdir -p "$WEB/labs" "$WEB/assets" "$WEB/html"

            # One-time flatten if a nested resources/ was created earlier
            if [ -d "$WEB/resources" ]; then
              rsync -a "$WEB/resources/" "$WEB/" && rm -rf "$WEB/resources"
            fi

            chown -R qadmin:qadmin "$WEB"
            find "$WEB" -type d -exec chmod 755 {} \;
            find "$WEB" -type f -exec chmod 644 {} \;

            echo "✅ Prepared $WEB (owned by qadmin)."

      - name: 🧾 List target permissions (post-prep)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_HOST_PUBLIC }}
          username: ${{ secrets.SSH_USER_ROOT_PUBLIC }}
          password: ${{ secrets.SSH_PASSWORD_ROOT_PUBLIC }}
          port: 22
          script: |
            set -e
            WEB="/home/quscitech/public_html/instructors/QST-INST-2025/resources"
            ls -ld "$WEB" || true
            ls -ld "$WEB/labs" || true

      # IMPORTANT: upload the CONTENTS of /resources (avoid creating resources/resources)
      - name: 📤 Upload via SFTP (PUBLIC)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:      ${{ secrets.SFTP_HOST_PUBLIC }}
          username:    ${{ secrets.SFTP_USER_PUBLIC }}          # qadmin
          password:    ${{ secrets.SFTP_PASSWORD_PUBLIC }}
          port:        22
          local_path:  "public_html/instructors/QST-INST-2025/resources/*"
          remote_path: "/home/quscitech/public_html/instructors/QST-INST-2025/resources"
          sftp_only:   false
          args: -o StrictHostKeyChecking=no
          delete_remote_files: false

      - name: 🌐 Verify file reachable (curl smoke test with retry)
        env:
          VPS_IP: ${{ secrets.VPS_IP_PUBLIC }}   # your server IP for --resolve
        run: |
          set -e
          URL="https://${{ env.WEB_HOSTNAME }}/${{ env.SMOKE_PATH }}"
          echo "Checking $URL"
          for i in {1..8}; do
            if curl -fsSIL --resolve "${{ env.WEB_HOSTNAME }}:443:${VPS_IP}" "$URL"; then
              echo "✅ Smoke test passed"; exit 0
            fi
            echo "⏳ Waiting and retrying ($i/8)…"; sleep 5
          done
          echo "❌ Smoke test failed: file not reachable" >&2; exit 1

      # ---------- Optional email notice ----------
      - name: 🔐 Decide if SMTP step should run
        env:
          SMTP_HOST:     ${{ secrets.SMTP_HOST }}
          SMTP_PORT_SEC: ${{ secrets.SMTP_PORT }}
          SMTP_USER:     ${{ secrets.SMTP_USERNAME }}
          SMTP_PASS:     ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM_SEC: ${{ secrets.MAIL_FROM }}
          MAIL_TO_SEC:   ${{ secrets.MAIL_TO }}
        run: |
          set -e
          if [ -n "${SMTP_HOST}" ] && [ -n "${SMTP_PORT_SEC}" ] && \
             [ -n "${SMTP_USER}" ] && [ -n "${SMTP_PASS}" ] && \
             [ -n "${MAIL_FROM_SEC}" ] && [ -n "${MAIL_TO_SEC}" ]; then
            echo "HAS_SMTP=true" >> "$GITHUB_ENV"
            echo "SMTP_PORT=${SMTP_PORT_SEC}" >> "$GITHUB_ENV"
          else
            echo "HAS_SMTP=false" >> "$GITHUB_ENV"
          fi

      - name: ✉️ Send deploy email
        if: env.HAS_SMTP == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}             # qram.quscitech.com
          server_port:    ${{ env.SMTP_PORT }}                 # 587 (STARTTLS) or 465 (SSL)
          secure:         ${{ env.SMTP_PORT == '465' }}        # true for 465, false for 587 (STARTTLS)
          username:       ${{ secrets.SMTP_USERNAME }}
          password:       ${{ secrets.SMTP_PASSWORD }}
          from:           ${{ secrets.MAIL_FROM }}
          to:             ${{ secrets.MAIL_TO }}
          subject: "QuSciTech Deploy: ${{ github.repository }} @ ${{ github.sha }}"
          convert_markdown: true
          body: |
            ✅ Public deployment completed.
            Host: ${{ secrets.SFTP_HOST_PUBLIC }}
            Target: /home/quscitech/public_html/instructors/QST-INST-2025/resources
            Smoke: https://${{ env.WEB_HOSTNAME }}/${{ env.SMOKE_PATH }}
            Repo: ${{ github.repository }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}

