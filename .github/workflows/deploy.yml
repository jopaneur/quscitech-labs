name: Deploy to QuSciTech (SFTP) + Smoke Test (Public)

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/deploy.yml"
      - "public/**"
      - "public_html/**"
  workflow_dispatch: {}
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read

env:
  PUBLIC_ROOT: /home/quscitech/public_html/instructors/QST-INST-2025
  SMOKE_PATH:  resources/hello-ci.html

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # --- Stage a smoke-test file into the web-ready tree
      - name: 🧪 Ensure smoke-test file exists (PUBLIC)
        shell: bash
        run: |
          set -e
          mkdir -p public_html/instructors/QST-INST-2025/resources
          cat > public_html/instructors/QST-INST-2025/resources/hello-ci.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <title>QuSciTech CI Smoke Test (Public)</title>
          <h1>✅ CI/CD (public) is working</h1>
          <p id="marker">HELLO-CI</p>
          <p>Built at (UTC): __BUILD_TIME__</p>
          HTML
          sed -i "s/__BUILD_TIME__/$(date -u +'%Y-%m-%d %H:%M:%S')/" public_html/instructors/QST-INST-2025/resources/hello-ci.html

      # --- Show we really have ALL 18 labs locally before upload (tiny debug)
      - name: 🔎 Verify local web tree (flatten labs)
        shell: bash
        run: |
          set -e
          echo "::group::Local labs listing"
          find public/labs -mindepth 2 -maxdepth 2 -type d -printf '%P\n' | sort
          echo "::endgroup::"
          # mirror to web-ready tree
          mkdir -p public_html/instructors/QST-INST-2025/resources/labs
          rsync -a --delete public/labs/ public_html/instructors/QST-INST-2025/resources/labs/
          echo "Count in staged web tree:"
          find public_html/instructors/QST-INST-2025/resources/labs -mindepth 1 -maxdepth 1 -type d | wc -l

      - name: 🔎 Probe SFTP port 22 (non-blocking)
        shell: bash
        env:
          HOST: ${{ secrets.SFTP_HOST_PUBLIC }}
        run: |
          set +e
          echo "Probing ${HOST}:22 ..."
          if timeout 10 bash -lc "cat < /dev/tcp/${HOST}/22" ; then
            echo "✅ Port 22 reachable"
          else
            echo "::warning::Port 22 NOT reachable (will attempt upload anyway)"
          fi

      # --- One-time cleanup hook (harmless if nothing to do)
      - name: 🧹 One-time cleanup (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SFTP_HOST_PUBLIC }}
          username: ${{ secrets.SFTP_USER_PUBLIC }}
          password: ${{ secrets.SFTP_PASSWORD_PUBLIC }}
          port:     22
          script: |
            set -e
            echo "No-op cleanup step (reserved)."

      # --- Prepare remote target; mkdir; chown iff running as root
      - name: 🧱 Prepare remote target (mkdir + chown **)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SFTP_HOST_PUBLIC }}
          username: ${{ secrets.SSH_USER_ROOT_PUBLIC || secrets.SFTP_USER_PUBLIC }}
          password: ${{ secrets.SSH_PASSWORD_ROOT_PUBLIC || secrets.SFTP_PASSWORD_PUBLIC }}
          port:     22
          script: |
            set -e
            BASE="${{ env.PUBLIC_ROOT }}"
            mkdir -p "$BASE/resources/labs"
            if [ "$(id -u)" -eq 0 ]; then
              chown -R quscitech:quscitech "$BASE"
            fi
            chmod -R 755 "$BASE"
            echo "Prepared: $BASE"

      # --- List perms so we can see ownership prior to upload
      - name: 🗂️ List target permissions (post-prep)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SFTP_HOST_PUBLIC }}
          username: ${{ secrets.SFTP_USER_PUBLIC }}
          password: ${{ secrets.SFTP_PASSWORD_PUBLIC }}
          port:     22
          script: |
            set -e
            ls -ld  ${{ env.PUBLIC_ROOT }}
            ls -ld  ${{ env.PUBLIC_ROOT }}/resources
            ls -ld  ${{ env.PUBLIC_ROOT }}/resources/labs || true

      # --- Remove any accidental nested 'resources/resources'
      - name: 🧽 Remove accidental nested resources (safe if absent)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SFTP_HOST_PUBLIC }}
          username: ${{ secrets.SFTP_USER_PUBLIC }}
          password: ${{ secrets.SFTP_PASSWORD_PUBLIC }}
          port:     22
          script: |
            set -e
            rm -rf ${{ env.PUBLIC_ROOT }}/resources/resources

      # --- Upload CONTENTS of resources (note the trailing /*)
      - name: 📤 Upload via SFTP (PUBLIC)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:       ${{ secrets.SFTP_HOST_PUBLIC }}
          port:         22
          username:     ${{ secrets.SFTP_USER_PUBLIC }}
          password:     ${{ secrets.SFTP_PASSWORD_PUBLIC }}
          local_path:   public_html/instructors/QST-INST-2025/resources/*
          remote_path:  ${{ env.PUBLIC_ROOT }}/resources
          sftp_only:    false
          delete_remote_files: false
          args: "-o StrictHostKeyChecking=no"

      # --- Curl smoke test (ignore cert while DNS/cert stabilizes)
      - name: 🌐 Verify file reachable (curl smoke test with retry)
        shell: bash
        env:
          VPS_IP:  ${{ secrets.VPS_IP }}
        run: |
          set -e
          URL="https://quscitech.com/instructors/QST-INST-2025/resources/hello-ci.html"
          echo "GET $URL"
          for i in 1 2 3; do
            code=$(curl -k -sSL -o out.html -w "%{http_code}" --resolve "quscitech.com:443:${VPS_IP}" "$URL" || true)
            echo "Attempt $i → HTTP $code"
            grep -qi "HELLO-CI" out.html && { echo "✅ Smoke OK"; exit 0; }
            sleep 2
          done
          echo "::error::Smoke test failed"; exit 1

      # --- (Optional) SMTP notify gated by secrets
      - name: 🤔 Decide if SMTP step should run
        shell: bash
        env:
          SMTP_HOST:     ${{ secrets.SMTP_HOST }}
          SMTP_USER:     ${{ secrets.SMTP_USERNAME }}
          SMTP_PASS:     ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM_SEC: ${{ secrets.MAIL_FROM }}
        run: |
          if [ -n "${SMTP_HOST}" ] && [ -n "${SMTP_USER}" ] && [ -n "${SMTP_PASS}" ] && [ -n "${MAIL_FROM_SEC}" ]; then
            echo "HAS_SMTP=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SMTP=false" >> "$GITHUB_ENV"
          fi

      - name: ✉️ Send deploy email
        if: ${{ env.HAS_SMTP == 'true' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port:    ${{ secrets.SMTP_PORT }}
          secure:         ${{ secrets.SMTP_PORT == '465' }}
          username:       ${{ secrets.SMTP_USERNAME }}
          password:       ${{ secrets.SMTP_PASSWORD }}
          from:           ${{ secrets.MAIL_FROM }}
          to:             ops@quscitech.com
          subject: "✅ Public Deploy Succeeded — ${{ github.repository }}"
          convert_markdown: true
          body: |
            ✅ Public deploy succeeded.
            • Repo: ${{ github.repository }}
            • Commit: ${{ github.sha }}
            • URL: https://quscitech.com/instructors/QST-INST-2025/resources/hello-ci.html

