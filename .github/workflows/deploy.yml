name: Deploy to QuSciTech (SFTP) + Smoke Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  HOST_PUBLIC: ${{ secrets.SFTP_HOST_PUBLIC }}
  SFTP_USER: ${{ secrets.SFTP_USER_PUBLIC }}
  SFTP_PASS: ${{ secrets.SFTP_PASSWORD_PUBLIC }}
  SSH_ROOT: ${{ secrets.SSH_USER_ROOT_PUBLIC }}
  SSH_ROOT_PW: ${{ secrets.SSH_PASSWORD_ROOT_PUBLIC }}
  REMOTE_BASE: /home/quscitech/public_html/instructors/QST-INST-2025/resources
  STAGE_DIR: "${{ runner.temp }}/webroot"   # ✅ Fixed expression syntax

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare local web tree (tiered labs)
        run: |
          set -euo pipefail
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"/{Advanced_Labs,Beginner_Labs,Intermediate_Labs}
          rsync -a --delete "public/labs/Advanced_Labs/" "$STAGE_DIR/Advanced_Labs/"
          rsync -a --delete "public/labs/Beginner_Labs/" "$STAGE_DIR/Beginner_Labs/"
          rsync -a --delete "public/labs/Intermediate_Labs/" "$STAGE_DIR/Intermediate_Labs/"
          if [ -f "public_html/instructors/QST-INST-2025/resources/labs/README.md" ]; then
            cp -f "public_html/instructors/QST-INST-2025/resources/labs/README.md" "$STAGE_DIR/README.md"
          fi

      - name: Show staged contents (debug)
        run: |
          echo "Staged path: $STAGE_DIR"
          find "$STAGE_DIR" -maxdepth 3 -type f | sort | sed -n '1,100p'

      - name: Probe SFTP port 22 (non-blocking)
        run: |
          set +e
          echo "Probing ${HOST_PUBLIC}:22..."
          if timeout 10 bash -lc "cat </dev/null >/dev/tcp/${HOST_PUBLIC}/22"; then
            echo "✅ Port 22 reachable"
          else
            echo "::warning ::Port 22 NOT reachable (will attempt upload anyway)"
          fi

      - name: Prepare remote target (mkdir + chown quscitech)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.HOST_PUBLIC }}
          username: ${{ env.SSH_ROOT }}
          password: ${{ env.SSH_ROOT_PW }}
          port: 22
          script: |
            set -eux
            BASE="${REMOTE_BASE}"
            mkdir -p "$BASE/Advanced_Labs" "$BASE/Beginner_Labs" "$BASE/Intermediate_Labs"
            chown -R quscitech:quscitech "$BASE"
            chmod -R 755 "$BASE"
            echo "✅ Verified remote base permissions for $BASE"

      - name: Upload via SFTP (PUBLIC)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ env.HOST_PUBLIC }}
          username: ${{ env.SFTP_USER }}
          password: ${{ env.SFTP_PASS }}
          port: 22
          sftp_only: false
          local_path: ${{ env.STAGE_DIR }}
          remote_path: ${{ env.REMOTE_BASE }}
          args: "-o StrictHostKeyChecking=no"
          delete_remote_files: false

      - name: Verify file reachable (optional)
        run: echo "Skipping smoke test step for now."

      - name: Complete job
        run: echo "✅ Tiered lab deployment completed successfully."

