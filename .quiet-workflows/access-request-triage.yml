name: Access Request — Triage & Auto‑Verify
on:
  issues:
    types: [opened, edited, labeled]

permissions:
  issues: write
  contents: read

env:
  LICENSES_REPO: ${{ secrets.LICENSES_REPO }}            # e.g., jopaneur/quscitech-licenses
  LICENSES_PATH: ${{ secrets.LICENSES_PATH }}            # e.g., data/allowlist.csv
  TARGET_REPO:  ${{ secrets.TARGET_REPO }}               # e.g., jopaneur/quscitech-labs-full

jobs:
  triage:
    if: |
      github.event.issue.state == 'open' &&
      (contains(github.event.issue.labels.*.name, 'access-request') ||
       endsWith(github.event.issue.title, 'Access Request'))
    runs-on: ubuntu-latest
    steps:
      - name: Parse issue form
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            function pick(label){
              const rx = new RegExp(`(?<=^|\n)${label}\s*\n\s*`, 'i');
              const idx = body.search(rx);
              if(idx < 0) return "";
              const rest = body.slice(idx).split("\n").slice(1);
              const stop = rest.findIndex(l => /^\s*\*\*.+\*\*\s*$/.test(l));
              const chunk = rest.slice(0, stop >= 0 ? stop : undefined).join("\n").trim();
              return chunk.replace(/^>\s*/gm,"").trim();
            }
            const data = {
              name:   pick("**Full name**"),
              email:  pick("**Email"),
              github: pick("**GitHub username**"),
              purchase: pick("**Book purchase identifier"),
              retailer: pick("**Retailer**"),
              scope:  pick("**Requested scope**"),
              notes:  pick("**Notes")
            };
            core.setOutput("json", JSON.stringify(data));
            core.info(`Parsed: ${JSON.stringify(data)}`);

      - name: Fail if GitHub handle is missing
        if: steps.parse.outputs.json == '' || fromJSON(steps.parse.outputs.json).github == ''
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed("Missing GitHub handle — cannot continue triage.")

      - name: Fetch license allow‑list CSV
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.LICENSES_REPO_TOKEN }}
        run: |
          if [ -z "${LICENSES_REPO}" ] || [ -z "${LICENSES_PATH}" ]; then
            echo "skip_fetch=1" >> $GITHUB_OUTPUT
            exit 0
          fi
          gh api repos/${LICENSES_REPO}/contents/${LICENSES_PATH}             -H "Accept: application/vnd.github.raw" > allowlist.csv
          echo "skip_fetch=0" >> $GITHUB_OUTPUT
          echo "Downloaded allowlist.csv"

      - name: Verify purchase identifier against allow‑list
        id: verify
        run: |
          set -e
          DATA='${{ steps.parse.outputs.json }}'
          PID=$(echo "$DATA" | jq -r '.purchase' | tr -d '\r\n' )
          if [ "${{ steps.fetch.outputs.skip_fetch }}" = "1" ]; then
            echo "verified=false" >> $GITHUB_OUTPUT
            echo "reason=No allow-list configured" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ -z "$PID" ]; then
            echo "verified=false" >> $GITHUB_OUTPUT
            echo "reason=No purchase id" >> $GITHUB_OUTPUT
            exit 0
          fi
          if grep -qi "$PID" allowlist.csv ; then
            echo "verified=true" >> $GITHUB_OUTPUT
            echo "reason=Found on allow-list" >> $GITHUB_OUTPUT
          else
            echo "verified=false" >> $GITHUB_OUTPUT
            echo "reason=Not found on allow-list" >> $GITHUB_OUTPUT
          fi

      - name: Apply scope label
        uses: actions/github-script@v7
        with:
          script: |
            const data = JSON.parse('${{ steps.parse.outputs.json }}');
            const scope = (data.scope || '').toLowerCase();
            let label = 'scope:unknown';
            if (scope.includes('beginner')) label = 'scope:E1';
            else if (scope.includes('intermediate')) label = 'scope:E2-E3';
            else if (scope.includes('full')) label = 'scope:E1-E3';
            else if (scope.includes('instructor')) label = 'scope:instructor';
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.issue.number,
              labels: [label]
            });

      - name: Add status label based on verification
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ steps.verify.outputs.verified }}' === 'true';
            const label = ok ? 'approved' : 'needs-verification';
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.issue.number,
              labels: [label]
            });

      - name: Post triage comment
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ steps.verify.outputs.verified }}' === 'true';
            const why = '${{ steps.verify.outputs.reason }}';
            const data = JSON.parse('${{ steps.parse.outputs.json }}');
            const msg = ok
              ? `✅ Auto‑verified purchase for **@${data.github}**. Labeling **approved**.`
              : `🟡 Could not auto‑verify purchase id. Reason: _${why}_. Labeling **needs‑verification** for moderator review.`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: msg
            });

