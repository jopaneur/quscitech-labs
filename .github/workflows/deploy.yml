name: Deploy to QuSciTech (SFTP) + Smoke Test

on:
  push:
    branches: [ main ]
    paths:
      - 'public_html/**'
      - 'tools/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

env:
  WEB_HOSTNAME: quscitech.com
  SMOKE_PATH: instructors/QST-INST-2025/resources/hello-ci.html

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧰 Checkout
        uses: actions/checkout@v4

      - name: 📝 Ensure smoke-test file exists (PUBLIC)
        run: |
          set -e
          mkdir -p public_html/instructors/QST-INST-2025/resources
          [ -f public_html/instructors/QST-INST-2025/resources/hello-ci.html ] || cat > public_html/instructors/QST-INST-2025/resources/hello-ci.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <title>QuSciTech CI Smoke Test</title>
          <h1>✅ CI/CD is working</h1>
          <p>Built at: $(date -u)</p>
          HTML
          echo "---- DIAG: list under resources ----"
          ls -lah public_html/instructors/QST-INST-2025/resources || true

      - name: 🔎 Probe SFTP port 22 (non-blocking)
        continue-on-error: true
        run: |
          set -e
          HOST="${{ secrets.SFTP_HOST_PUBLIC }}"
          echo "Probing $HOST:22 ..."
          if timeout 10 bash -lc "cat < /dev/tcp/$HOST/22"; then
            echo "✅ Port 22 reachable"
          else
            echo "::warning ::❌ Port 22 NOT reachable (will attempt upload anyway)"
          fi

      # ---------- One-time server cleanup (manual only) ----------
      - name: 🧹 One-time server cleanup (SSH as root)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_HOST_PUBLIC }}
          username: ${{ secrets.SSH_USER_ROOT_PUBLIC }}      # root
          password: ${{ secrets.SSH_PASSWORD_ROOT_PUBLIC }}
          port: 22
          script: |
            set -euo pipefail
            PUB="/home/quscitech/public_html/instructors/QST-INST-2025/resources"
            PRIV="/home/quscitech/public_html/private/instructors/QST-INST-2025/resources"

            echo "== BEFORE CLEANUP (depth 2) =="
            find "$PUB"  -maxdepth 2 -type d | sort || true
            echo "---"
            find "$PRIV" -maxdepth 2 -type d | sort || true
            echo "================================"

            [ -d "$PUB/public" ]  && rm -rf "$PUB/public"  || true
            [ -d "$PRIV/labs/labs" ] && rm -rf "$PRIV/labs/labs" || true

            for bad in \
              "$PUB/labs/qais-cshs-correlation-sweep-lab" \
              "$PUB/labs/qais-density-matrix-encoding-metricies-lab" \
              "$PRIV/labs/qais-cshs-correlation-sweep-lab" \
              "$PRIV/labs/qais-density-matrix-encoding-metricies-lab"
            do [ -d "$bad" ] && rm -rf "$bad" || true; done

            find "$PUB"  -type d -exec chmod 755 {} \; || true
            find "$PUB"  -type f -exec chmod 644 {} \; || true

            echo "== AFTER CLEANUP (depth 2) =="
            find "$PUB"  -maxdepth 2 -type d | sort || true
            echo "---"
            find "$PRIV" -maxdepth 2 -type d | sort || true
            echo "================================"

      # ---------- Prepare target (mkdir + chown) ----------
      - name: 🧱 Prepare public target (mkdir + chown for qadmin)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_HOST_PUBLIC }}
          username: ${{ secrets.SSH_USER_ROOT_PUBLIC }}      # root
          password: ${{ secrets.SSH_PASSWORD_ROOT_PUBLIC }}
          port: 22
          script: |
            set -euo pipefail
            BASE="/home/quscitech/public_html/instructors/QST-INST-2025/resources"

            # Base dirs
            mkdir -p "$BASE" "$BASE/assets" "$BASE/html" "$BASE/labs"

            # Ensure every current lab subdir exists (mirror repo list)
            for L in \
              qais-bloch-trajectories-lab \
              qais-case-study-qalis-vs-crqc-llm-lab \
              qais-chsh-correlation-sweep-lab \
              qais-density-matrix-encoding-metrics-lab \
              qais-grover-success-vs-noise \
              qais-hybrid-pipeline-quantum-kernel-svm-lab \
              qais-tiny-vqc-vs-logregression-lab \
              qais-angle-encoding-statevectors-lab \
              qais-bell-state-correlated-outcomes-lab \
              qais-depth-noise-sensitivity-lab \
              qais-quantum-teleportation-lab \
              qais-superposition-lab \
              qais-BB84-QKD-lab \
              qais-VQE-Toy-Minimization-lab \
              qais-entanglement-tamper-check-lab \
              qais-fidelity-trace-distance-lab \
              qais-quantum-kernel-svm-vs-logregression-lab \
              qais-zz-expectation-scan-lab
            do
              mkdir -p "$BASE/labs/$L"
            done

            # Hand ownership to the SFTP user (qadmin) and friendly perms
            chown -R qadmin:qadmin "/home/quscitech/public_html/instructors"
            chmod -R 755 "/home/quscitech/public_html/instructors"

            echo "== POST-PREP OWNERSHIP =="
            ls -ld "$BASE" "$BASE/labs" || true
            getfacl -p "$BASE" 2>/dev/null | head -n 20 || true
            echo "✅ Prepared target for qadmin."

      - name: 🗒️ List target permissions (post-prep)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_HOST_PUBLIC }}
          username: ${{ secrets.SSH_USER_ROOT_PUBLIC }}
          password: ${{ secrets.SSH_PASSWORD_ROOT_PUBLIC }}
          port: 22
          script: |
            set -euo pipefail
            BASE="/home/quscitech/public_html/instructors/QST-INST-2025/resources"
            ls -ld "$BASE" "$BASE/labs" "$BASE/assets" "$BASE/html" || true
            ls -ld "$BASE/labs/"*/ 2>/dev/null || true
            echo "id(qadmin):"
            id qadmin || true

      - name: 📤 Upload via SFTP (PUBLIC)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:        ${{ secrets.SFTP_HOST_PUBLIC }}
          username:      ${{ secrets.SFTP_USER_PUBLIC }}      # qadmin
          password:      ${{ secrets.SFTP_PASSWORD_PUBLIC }}
          port:          22
          # Give the action a directory, not a glob; it will push its contents
          local_path:    public_html/instructors/QST-INST-2025/resources
          # *** KEY FIX *** use chroot-relative path (no /home/quscitech) + trailing slash
          remote_path:   public_html/instructors/QST-INST-2025/resources/
          sftp_only:     false
          args: -o StrictHostKeyChecking=no
          delete_remote_files: false


      - name: 🌐 Verify file reachable (curl smoke test with retry)
        env:
          VPS_IP: ${{ secrets.VPS_IP_PUBLIC }}
        run: |
          set -e
          URL="https://${{ env.WEB_HOSTNAME }}/${{ env.SMOKE_PATH }}"
          echo "Checking $URL"
          for i in {1..8}; do
            if curl -fsSIL --resolve "${{ env.WEB_HOSTNAME }}:443:${VPS_IP}" "$URL"; then
              echo "✅ Smoke test passed"; exit 0
            fi
            echo "⏳ Waiting and retrying ($i/8)..."; sleep 5
          done
          echo "❌ Smoke test failed: file not reachable" >&2; exit 1

      - name: 🔐 Decide if SMTP step should run
        env:
          SMTP_HOST:     ${{ secrets.SMTP_HOST }}
          SMTP_PORT_SEC: ${{ secrets.SMTP_PORT }}
          SMTP_USER:     ${{ secrets.SMTP_USERNAME }}
          SMTP_PASS:     ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM_SEC: ${{ secrets.MAIL_FROM }}
          MAIL_TO_SEC:   ${{ secrets.MAIL_TO }}
        run: |
          set -e
          if [ -n "${SMTP_HOST}" ] && [ -n "${SMTP_PORT_SEC}" ] && \
             [ -n "${SMTP_USER}" ] && [ -n "${SMTP_PASS}" ] && \
             [ -n "${MAIL_FROM_SEC}" ] && [ -n "${MAIL_TO_SEC}" ]; then
            echo "HAS_SMTP=true" >> "$GITHUB_ENV"
            echo "SMTP_PORT=${SMTP_PORT_SEC}" >> "$GITHUB_ENV"
          else
            echo "HAS_SMTP=false" >> "$GITHUB_ENV"
          fi

      - name: ✉️ Send deploy email
        if: env.HAS_SMTP == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port:    ${{ env.SMTP_PORT }}
          username:       ${{ secrets.SMTP_USERNAME }}
          password:       ${{ secrets.SMTP_PASSWORD }}
          from:           ${{ secrets.MAIL_FROM }}
          to:             ${{ secrets.MAIL_TO }}
          subject: "QuSciTech Deploy: ${{ github.repository }} @ ${{ github.sha }} (PUBLIC)"
          secure: ${{ env.SMTP_PORT == '465' }}
          body: |
            ✅ Deployment completed to ${{ secrets.SFTP_HOST_PUBLIC }}:/home/quscitech/public_html/instructors/QST-INST-2025/resources
            🔎 Smoke check URL: https://${{ env.WEB_HOSTNAME }}/${{ env.SMOKE_PATH }}
            Repo: ${{ github.repository }}
            Commit: ${{ github.sha }}
            By: ${{ github.actor }}


