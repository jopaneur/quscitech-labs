name: Deploy to QuSciTech (SFTP) + Smoke Test (Public)

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/deploy.yml'
      - 'public/**'
      - 'public_html/**'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # Public smoke marker we publish under /resources/
  SMOKE_PATH: hello-ci.html

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧪 Ensure smoke-test file exists (PUBLIC)
        shell: bash
        run: |
          set -euo pipefail
          BASE="public_html/instructors/QST-INST-2025/resources"
          mkdir -p "$BASE"
          cat > "$BASE/${SMOKE_PATH}" <<'HTML'
          <!doctype html><meta charset="utf-8">
          <title>QuSciTech CI Smoke Test (Public)</title>
          <h1>✅ CI/CD (public) is working</h1>
          <p id="marker">HELLO-CI</p>
          <p>Built at (UTC): __BUILD_TIME__</p>
          HTML
          sed -i "s/__BUILD_TIME__/$(date -u +'%Y-%m-%d %H:%M:%S')/" "$BASE/${SMOKE_PATH}"

      - name: 🔎 Probe SFTP port 22 (non-blocking)
        shell: bash
        run: |
          set -e
          HOST="${{ secrets.SFTP_HOST_PUBLIC }}"
          echo "Probing $HOST:22 ..."
          if timeout 10 bash -lc "cat < /dev/null > /dev/tcp/$HOST/22"; then
            echo "✅ Port 22 reachable"
          else
            echo "::warning ::Port 22 NOT reachable (will attempt upload anyway)"
          fi

      - name: 🧹 One-time cleanup (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SFTP_HOST_PUBLIC }}
          username: ${{ secrets.SFTP_USER_PUBLIC }}
          password: ${{ secrets.SFTP_PASSWORD_PUBLIC }}
          port:     22
          script: |
            set -e
            BASE="/home/quscitech/public_html/instructors/QST-INST-2025/resources"
            mkdir -p "$BASE"
            # Remove only the labs folder to avoid nuking other assets.
            rm -rf "$BASE/labs"

      - name: 🧱 Prepare remote target (mkdir + chown quscitech)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SFTP_HOST_PUBLIC }}
          username: ${{ secrets.SFTP_USER_PUBLIC }}
          password: ${{ secrets.SFTP_PASSWORD_PUBLIC }}
          port:     22
          script: |
            set -e
            BASE="/home/quscitech/public_html/instructors/QST-INST-2025/resources"
            mkdir -p "$BASE/labs"
            chown -R quscitech:quscitech "/home/quscitech/public_html/instructors/QST-INST-2025"
            chmod -R 755 "/home/quscitech/public_html/instructors/QST-INST-2025"

      - name: 🧾 List target permissions (post-prep)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SFTP_HOST_PUBLIC }}
          username: ${{ secrets.SFTP_USER_PUBLIC }}
          password: ${{ secrets.SFTP_PASSWORD_PUBLIC }}
          port:     22
        # show remote perms for quick sanity-check
          script: |
            set -e
            ls -ld /home/quscitech/public_html/instructors/QST-INST-2025/resources
            ls -ld /home/quscitech/public_html/instructors/QST-INST-2025/resources/labs || true

      # ---------- NEW: reliable local flatten + debug ----------
      - name: 🗂️ Prepare local web tree (flatten labs)
        shell: bash
        run: |
          set -euo pipefail
          BASE="public_html/instructors/QST-INST-2025/resources"
          SRC="public/labs"
          DEST="$BASE/labs"

          rm -rf "$DEST"
          mkdir -p "$DEST"

          # Copy each lab folder that sits one level under Beginner_/Intermediate_/Advanced_*
          while IFS= read -r -d '' LABDIR; do
            LABNAME="$(basename "$LABDIR")"
            echo "→ Copying $LABDIR  ->  $DEST/$LABNAME"
            cp -a "$LABDIR" "$DEST/$LABNAME"
          done < <(find "$SRC" -mindepth 2 -maxdepth 2 -type d -print0)

          echo "Local staging complete."

      - name: 🔍 List staged web tree
        shell: bash
        run: |
          set -e
          DEST="public_html/instructors/QST-INST-2025/resources/labs"
          echo "Staged labs:"
          if command -v tree >/dev/null 2>&1; then
            tree -a -L 2 "$DEST"
          else
            find "$DEST" -maxdepth 2 -type d -print | sort
          fi
          echo "Count:"
          find "$DEST" -mindepth 1 -maxdepth 1 -type d | wc -l
      # ---------- END NEW ----------

      - name: 📤 Upload via SFTP (PUBLIC)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:       ${{ secrets.SFTP_HOST_PUBLIC }}
          port:         22
          username:     ${{ secrets.SFTP_USER_PUBLIC }}
          password:     ${{ secrets.SFTP_PASSWORD_PUBLIC }}
          # Upload the prepared directory (no wildcard)
          local_path:   public_html/instructors/QST-INST-2025/resources
          remote_path:  /home/quscitech/public_html/instructors/QST-INST-2025/resources
          sftp_only:    false
          delete_remote_files: false
          args: -o StrictHostKeyChecking=no

      - name: 🌐 Verify file reachable (curl smoke test with retry)
        shell: bash
        env:
          BASE_URL: https://quscitech.com/instructors/QST-INST-2025/resources
        run: |
          set -euo pipefail
          URL="${BASE_URL}/${SMOKE_PATH}"
          echo "GET $URL"
          for i in {1..4}; do
            code=$(curl -fsSIL -o /dev/null -w "%{http_code}" "$URL" || true)
            if [ "$code" = "200" ]; then
              echo "✅ Smoke OK (200)"
              exit 0
            fi
            echo "Attempt $i failed (code=$code); retrying..."
            sleep 2
          done
          echo "::error ::Smoke test failed for $URL"
          exit 1

      - name: 🤔 Decide if SMTP step should run
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASS: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          if [ -n "${SMTP_HOST}" ] && [ -n "${SMTP_USER}" ] && [ -n "${SMTP_PASS}" ] && [ -n "${MAIL_FROM}" ]; then
            echo "HAS_SMTP=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SMTP=false" >> "$GITHUB_ENV"
          fi

      - name: ✉️ Send deploy email
        if: ${{ env.HAS_SMTP == 'true' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port:    587
          secure:         false            # STARTTLS on 587
          username:       ${{ secrets.SMTP_USERNAME }}
          password:       ${{ secrets.SMTP_PASSWORD }}
          from:           ${{ secrets.MAIL_FROM }}
          to:             ops@quscitech.com
          subject: "✅ Public Deploy OK — ${{ github.repository }}"
          convert_markdown: true
          body: |
            ✅ Public deploy completed.
            Repo: ${{ github.repository }}
            Commit: ${{ github.sha }}
            Labs URL: https://quscitech.com/instructors/QST-INST-2025/resources/labs/

