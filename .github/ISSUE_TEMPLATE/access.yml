name: "Access Request"
description: "Request access to the private QuSciTech Labs (E.1–E.3)"
labels: ["access-request"]
body:
  - type: input
    id: name
    attributes: { label: Full name, placeholder: "Dr. Joe Wilson" }
    validations: { required: true }
  - type: input
    id: email
    attributes: { label: Email, placeholder: "your@email.com" }
    validations: { required: true }
  - type: input
    id: github
    attributes: { label: GitHub username, placeholder: "jopaneur" }
    validations: { required: true }
  - type: input
    id: purchase
    attributes: { label: Book purchase identifier, placeholder: "Order # / KDP receipt" }
    validations: { required: true }
  - type: dropdown
    id: retailer
    attributes: { label: Retailer, options: ["Amazon KDP","Other"] }
  - type: dropdown
    id: scope
    attributes: { label: Requested scope, options: ["E.1–E.3 (Full)","E.2–E.3","Course adoption"] }
  - type: textarea
    id: notes
    attributes: { label: Notes (optional), placeholder: "Course affiliation, timeline, etc." }
