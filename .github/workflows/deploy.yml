name: Deploy to QuSciTech (SFTP) + Smoke Test

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # allow manual runs from the Actions tab

env:
  WEB_HOSTNAME: quscitech.com
  SMOKE_PATH: instructors/QST-INST-2025/resources/hello-ci.html

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Sanity checks so we fail early with helpful logs ----
      - name: Debug: verify deploy source exists
        run: |
          echo "PWD: $(pwd)"
          echo "Top-level files:"
          ls -la
          echo "Checking ./public/ ..."
          if [ ! -d "./public" ]; then
            echo "❌ ./public folder not found. Create it and add your site files (e.g., public/hello-ci.html)."
            exit 1
          fi
          echo "public/ contents:"
          ls -la public
          # ensure at least one regular file exists
          if [ -z "$(find public -type f -maxdepth 1)" ]; then
            echo "❌ ./public exists but has no files to upload."
            exit 1
          fi
          # ensure smoke file exists so curl check is meaningful
          if [ ! -f "public/hello-ci.html" ]; then
            echo "⚠️  public/hello-ci.html not found; curl step will likely fail. Consider adding it."
          fi

      - name: Upload via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './public/'              # <- deploy source in your repo
          remote_path: ${{ secrets.SFTP_REMOTE_DIR }}  # /home/quscitech/public_html/instructors/QST-INST-2025/resources/
          sftp_only: true
          args: '-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=5'

      # Pre-DNS + Post-DNS compatible smoke test:
      # --resolve forces Host header to quscitech.com while hitting your VPS IP.
      - name: Verify file reachable (curl smoke test with retry)
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
        run: |
          set -e
          URL="https://${{ env.WEB_HOSTNAME }}/${{ env.SMOKE_PATH }}"
          echo "Checking $URL"
          for i in {1..8}; do
            if curl -fsSIL --resolve "${{ env.WEB_HOSTNAME }}:443:${VPS_IP}" "$URL"; then
              echo "✅ Smoke test passed"
              exit 0
            fi
            echo "⏳ Waiting and retrying ($i/8)..."
            sleep 5
          done
          echo "❌ Smoke test failed: file not reachable" >&2
          exit 1

      - name: Send deploy email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "QuSciTech Deploy: ${{ github.repository }} @ ${{ github.sha }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          secure: true
          body: |
            ✅ Deployment to ${{ secrets.SFTP_HOST }}:${{ secrets.SFTP_REMOTE_DIR }} completed.
            🔎 Smoke check URL: https://${{ env.WEB_HOSTNAME }}/${{ env.SMOKE_PATH }}
            Repo: ${{ github.repository }}
            Commit: ${{ github.sha }}
            By: ${{ github.actor }}
