name: Access Request — Status Follow‑ups
on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  followups:
    if: github.event.issue.state == 'open' && contains(fromJson('["approved","needs-verification","denied"]'), github.event.label.name)
    runs-on: ubuntu-latest
    steps:
      - name: Comment on status
        uses: actions/github-script@v7
        with:
          script: |
            const label = context.payload.label.name
            let body = ''
            if (label === 'approved') {
              body = '🎉 Your request is **approved**. An invitation to the private labs will be sent shortly.'
            } else if (label === 'needs-verification') {
              body = '🟡 Your request needs manual verification. A maintainer will follow up soon.'
            } else if (label === 'denied') {
              body = '❌ Your request was denied. If you believe this is in error, please reply with additional details.'
            }
            await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body})
