name: Deploy to QuSciTech (SFTP) + Smoke Test

on:
  push:
    branches: [ main ]
    paths:
      - "public/labs/**"
      - "public_html/instructors/QST-INST-2025/resources/labs/README.md"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      # correct usage of the runner temp context
      STAGE_DIR: ${{ runner.temp }}/labs_stage
      SRC_BEGINNER: public/labs/Beginner_Labs
      SRC_INTERMEDIATE: public/labs/Intermediate_Labs
      SRC_ADVANCED: public/labs/Advanced_Labs
      WEB_README: public_html/instructors/QST-INST-2025/resources/labs/README.md
      REMOTE_BASE: ${{ secrets.SFTP_REMOTE_DIR_PUBLIC }}/labs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build a tiered tree in a temp staging folder
      - name: Prepare tiered labs tree (staging)
        shell: bash
        run: |
          set -euo pipefail
          echo "Staging path: $STAGE_DIR"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"/{Beginner_Labs,Intermediate_Labs,Advanced_Labs}

          # copy each tier
          cp -a "$SRC_BEGINNER"/.      "$STAGE_DIR/Beginner_Labs/"
          cp -a "$SRC_INTERMEDIATE"/.  "$STAGE_DIR/Intermediate_Labs/"
          cp -a "$SRC_ADVANCED"/.      "$STAGE_DIR/Advanced_Labs/"

          # optional README for the /labs root (won't fail if missing)
          if [[ -f "$WEB_README" ]]; then
            cp -a "$WEB_README" "$STAGE_DIR/README.md"
          fi

      # Tiny debug so we can see exactly what will be uploaded
      - name: List staged content (debug)
        shell: bash
        run: |
          echo "== staged tree =="
          find "$STAGE_DIR" -maxdepth 2 -type d -printf "%P\n" | sort
          echo "== staged files sample =="
          find "$STAGE_DIR" -type f -maxdepth 2 -printf "%P\n" | sort | sed -n '1,50p'

      # Non-blocking probe (just warns if 22 closed; we still try upload)
      - name: Probe SFTP port 22 (non-blocking)
        shell: bash
        run: |
          set +e
          HOST="${{ secrets.SFTP_HOST_PUBLIC }}"
          echo "Probing $HOST:22 ..."
          if timeout 10 bash -lc "cat </dev/null >/dev/tcp/$HOST/22"; then
            echo "✅ Port 22 reachable"
          else
            echo "::warning ::Port 22 NOT reachable (will attempt upload anyway)"
          fi

      # Create remote /labs (in case it was removed). If the account has no shell,
      # this will silently be skipped.
      - name: Ensure remote /resources/labs exists (best-effort)
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host:     ${{ secrets.SFTP_HOST_PUBLIC }}
          username: ${{ secrets.SFTP_USER_PUBLIC }}
          password: ${{ secrets.SFTP_PASSWORD_PUBLIC }}
          port: 22
          script: |
            mkdir -p "${{ env.REMOTE_BASE }}"
            ls -ld "${{ env.REMOTE_BASE }}"

      # Upload the *staged tiered tree* to /resources/labs
      - name: Upload via SFTP (PUBLIC)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:   ${{ secrets.SFTP_HOST_PUBLIC }}
          username: ${{ secrets.SFTP_USER_PUBLIC }}
          password: ${{ secrets.SFTP_PASSWORD_PUBLIC }}
          port: 22
          # IMPORTANT: upload the STAGE_DIR *directory*, no wildcard
          local_path: ${{ env.STAGE_DIR }}
          remote_path: ${{ env.REMOTE_BASE }}
          sftp_only: false
          args: "-o StrictHostKeyChecking=no"
          delete_remote_files: false

      # Simple curl smoke check for the basic index/hello page if you like
      - name: Verify file reachable (smoke test)
        shell: bash
        continue-on-error: true
        env:
          URL: "https://qram.quscitech.com/instructors/QST-INST-2025/resources/hello-ci.html"
        run: |
          for i in {1..3}; do
            if curl -fsSIL "$URL" >/dev/null; then
              echo "✅ Smoke test passed"
              exit 0
            fi
            echo "Retry in 3s..."; sleep 3
          done
          echo "::warning ::Smoke test could not confirm $URL"

