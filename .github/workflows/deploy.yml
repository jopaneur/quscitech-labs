name: Deploy to QuSciTech (SFTP) + Smoke Test (PUBLIC)

on:
  push:
    branches: [ main ]
    paths:
      - 'public_html/**'
      - 'tools/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

env:
  WEB_HOSTNAME: quscitech.com
  # We’ll check BOTH root and instructors path
  SMOKE_PATH1: hello-ci.html
  SMOKE_PATH2: instructors/QST-INST-2025/resources/hello-ci.html

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🧰 Checkout
        uses: actions/checkout@v4

      # (optional) exporters + sync steps here if you use them…

      - name: 📝 Ensure smoke-test files exist in LOCAL web tree
        run: |
          set -e
          # root smoke
          mkdir -p public_html
          cat > public_html/hello-ci.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <title>QuSciTech Root Smoke</title>
          <h1>✅ Root smoke OK</h1>
          <p>Built at: $(date -u)</p>
          HTML
          # instructors smoke
          mkdir -p public_html/instructors/QST-INST-2025/resources
          cat > public_html/instructors/QST-INST-2025/resources/hello-ci.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <title>QuSciTech Instructors Smoke</title>
          <h1>✅ Instructors smoke OK</h1>
          <p>Built at: $(date -u)</p>
          HTML
          echo "Local tree:"
          find public_html -maxdepth 3 -type f -name "*hello-ci.html" -print

      - name: 🔎 Probe SFTP port 22 (PUBLIC host)
        run: |
          set -e
          HOST="${{ secrets.SFTP_HOST_PUBLIC }}"
          echo "Probing $HOST:22 ..."
          if timeout 5 bash -lc "cat < /dev/null > /dev/tcp/$HOST/22"; then
            echo "✅ Port 22 reachable"
          else
            echo "❌ Port 22 NOT reachable"; exit 1
          fi

      - name: 📤 Upload via SFTP (PUBLIC docroot)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:      ${{ secrets.SFTP_HOST_PUBLIC }}
          username:    ${{ secrets.SFTP_USER_PUBLIC }}
          password:    ${{ secrets.SFTP_PASSWORD_PUBLIC }}
          local_path:  ./public_html/
          remote_path: ${{ secrets.SFTP_REMOTE_DIR_PUBLIC }}   # /home/quscitech/public_html
          sftp_only:   true
          args: -o StrictHostKeyChecking=no

      # NEW: Immediately list the target locations over SSH to see what's actually there
      - name: 🧾 Verify files on server (ls)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SFTP_HOST_PUBLIC }}
          username: ${{ secrets.SFTP_USER_PUBLIC }}
          password: ${{ secrets.SFTP_PASSWORD_PUBLIC }}
          script: |
            set -e
            echo "== pwd and whoami =="
            pwd; whoami
            echo "== List docroot =="
            ls -al /home/quscitech/public_html | sed -n '1,120p'
            echo "== List root smoke =="
            ls -al /home/quscitech/public_html/hello-ci.html || true
            echo "== List instructors dir =="
            ls -al /home/quscitech/public_html/instructors || true
            echo "== List QST-INST-2025 =="
            ls -al /home/quscitech/public_html/instructors/QST-INST-2025 || true
            echo "== List resources =="
            ls -al /home/quscitech/public_html/instructors/QST-INST-2025/resources || true
            echo "== Stat resources smoke =="
            stat /home/quscitech/public_html/instructors/QST-INST-2025/resources/hello-ci.html || true

      - name: 🌐 Curl checks (root then instructors) with retry
        env:
          VPS_IP: ${{ secrets.VPS_IP_PUBLIC }}   # 37.148.203.89
        run: |
          set -e
          for path in "${{ env.SMOKE_PATH1 }}" "${{ env.SMOKE_PATH2 }}"; do
            URL="https://${{ env.WEB_HOSTNAME }}/${path}"
            echo "Checking $URL"
            ok=0
            for i in {1..8}; do
              if curl -fsSIL --resolve "${{ env.WEB_HOSTNAME }}:443:${VPS_IP}" "$URL"; then
                echo "✅ $path reachable"
                ok=1; break
              fi
              echo "⏳ retry ($i/8)…"; sleep 5
            done
            [ $ok -eq 1 ] || { echo "❌ $path not reachable"; exit 1; }
          done

