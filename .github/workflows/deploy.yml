name: CI (No Deploy) — QuSciTech Public Labs

# PURPOSE
# - This workflow is intentionally NON-DEPLOYING.
# - It exists only to validate repository structure and prevent drift.
# - It MUST NOT SSH/SCP/RSYNC to any server.
#
# POLICY
# - The webserver is the system of record.
# - GitHub is a mirror, not a deployment source.

on:
  push:
    branches: [ main ]
    paths:
      - "public/labs/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🔎 Validate expected lab roots exist"
        shell: bash
        run: |
          set -euo pipefail
          for d in             public/labs/Beginner_Labs             public/labs/Intermediate_Labs             public/labs/Advanced_Labs
          do
            if [ ! -d "$d" ]; then
              echo "::error ::Missing expected directory: $d"
              exit 1
            fi
          done
          echo "✅ Expected tier roots exist."

      - name: "🔎 Quick naming sanity (lowercase slugs + resources layout)"
        shell: bash
        run: |
          set -euo pipefail

          # Slug dirs should be lowercase (qais-*)
          bad=$(find public/labs -maxdepth 5 -type d -name 'qais-*' | grep -E '[A-Z]' || true)
          if [ -n "$bad" ]; then
            echo "::error ::Uppercase found in qais-* directory names:"
            echo "$bad"
            exit 1
          fi

          # resources/{notebooks,html} should exist for each lab slug (best-effort check)
          # (doesn't fail if some labs intentionally omit html)
          while IFS= read -r slugdir; do
            if [ ! -d "$slugdir/resources/notebooks" ]; then
              echo "::warning ::Missing resources/notebooks under: $slugdir"
            fi
            if [ ! -d "$slugdir/resources/html" ]; then
              echo "::notice ::No resources/html under: $slugdir (OK if HTML is generated on server)"
            fi
          done < <(find public/labs -maxdepth 4 -type d -name 'qais-*-lab' -o -name 'qais-*' | sort -u)

          echo "✅ Naming sanity completed."

      - name: "🧾 Summary"
        shell: bash
        run: |
          echo "This workflow does NOT deploy."
          echo "Server remains authoritative; GitHub is a mirror."
