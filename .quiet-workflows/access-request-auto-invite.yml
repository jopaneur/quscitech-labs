name: Access Request — Auto‑Invite on Approval
on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

env:
  TARGET_REPO:  ${{ secrets.TARGET_REPO }}   # e.g., jopaneur/quscitech-labs-full

jobs:
  invite:
    if: github.event.label.name == 'approved' && env.TARGET_REPO != ''
    runs-on: ubuntu-latest
    steps:
      - name: Parse handle from issue
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const m = body.match(/\*\*GitHub username\*\*[\s\S]*?\n\n([^\n]+)/i);
            const gh = m ? m[1].trim().replace(/^@/, '') : '';
            core.setOutput('handle', gh);
            core.info(`Handle: ${gh}`);

      - name: Send invite to private repo
        if: steps.parse.outputs.handle != ''
        env:
          GH_TOKEN: ${{ secrets.INVITER_TOKEN }}
        run: |
          set -e
          HANDLE="${{ steps.parse.outputs.handle }}"
          REPO="${TARGET_REPO}"
          echo "Inviting $HANDLE to $REPO ..."
          gh api -X PUT "repos/$REPO/collaborators/$HANDLE" -f permission=pull
          echo "Invitation sent."

      - name: Comment result
        uses: actions/github-script@v7
        with:
          script: |
            const handle = '${{ steps.parse.outputs.handle }}'
            const msg = handle
              ? `📨 Invitation sent to **@${handle}** for **${process.env.TARGET_REPO}**.`
              : `⚠️ Unable to parse GitHub handle from the issue. Please invite manually.`
            await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body: msg})

