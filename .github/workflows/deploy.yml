name: Deploy to QuSciTech (SFTP) + Smoke Test

on:
  push:
    branches: [ main ]
    paths:
      - 'public_html/**'
      - 'tools/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

env:
  WEB_HOSTNAME: quscitech.com
  SMOKE_PATH: instructors/QST-INST-2025/resources/hello-ci.html

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧰 Checkout
        uses: actions/checkout@v4

      # Ensure smoke-test file exists locally before upload
      - name: 📝 Ensure smoke-test file exists (PUBLIC)
        run: |
          set -e
          mkdir -p public_html/instructors/QST-INST-2025/resources
          [ -f public_html/instructors/QST-INST-2025/resources/hello-ci.html ] || cat > public_html/instructors/QST-INST-2025/resources/hello-ci.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <title>QuSciTech CI Smoke Test (Public)</title>
          <h1>✅ CI/CD Public Deploy Working</h1>
          <p>Built at: $(date -u)</p>
          HTML

      - name: 🔎 Probe SFTP port 22 (non-blocking)
        continue-on-error: true
        run: |
          set -e
          HOST="${{ secrets.SFTP_HOST_PUBLIC }}"
          echo "Probing $HOST:22 ..."
          if timeout 10 bash -lc "cat < /dev/tcp/$HOST/22"; then
            echo "✅ Port 22 reachable"
          else
            echo "::warning::❌ Port 22 NOT reachable (will attempt upload anyway)"
          fi

      # ---------- Prepare directories on remote (runs as root) ----------
      - name: 🧱 Prepare public target (mkdir + chown for quscitech)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_HOST_PUBLIC }}
          username: ${{ secrets.SSH_USER_ROOT_PUBLIC }}
          password: ${{ secrets.SSH_PASSWORD_ROOT_PUBLIC }}
          port: 22
          script: |
            set -euo pipefail
            BASE="/home/quscitech/public_html/instructors/QST-INST-2025/resources"
            mkdir -p "$BASE/labs" "$BASE/assets" "$BASE/html"
            chown -R quscitech:quscitech "$BASE"
            chmod -R 755 "$BASE"
            echo "✅ Ensured and prepared $BASE (owned by quscitech)"

      - name: 🕵️ List target permissions (post-prep)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_HOST_PUBLIC }}
          username: ${{ secrets.SSH_USER_ROOT_PUBLIC }}
          password: ${{ secrets.SSH_PASSWORD_ROOT_PUBLIC }}
          port: 22
          script: |
            ls -ld /home/quscitech/public_html/instructors/QST-INST-2025/resources
            ls -ld /home/quscitech/public_html/instructors/QST-INST-2025/resources/labs || true

      # ---------- Upload via SFTP (PUBLIC) ----------
      - name: 📤 Upload via SFTP (PUBLIC)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:      ${{ secrets.SFTP_HOST_PUBLIC }}
          username:    ${{ secrets.SFTP_USER_PUBLIC }}        # quscitech
          password:    ${{ secrets.SFTP_PASSWORD_PUBLIC }}
          port:        22
          local_path:  public_html/instructors/QST-INST-2025/resources
          remote_path: /home/quscitech/public_html/instructors/QST-INST-2025/resources/
          sftp_only:   false
          args: -o StrictHostKeyChecking=no
          delete_remote_files: false

      - name: 🌐 Verify file reachable (curl smoke test with retry)
        env:
          VPS_IP: ${{ secrets.VPS_IP_PUBLIC }}
        run: |
          set -e
          URL="https://${{ env.WEB_HOSTNAME }}/${{ env.SMOKE_PATH }}"
          echo "Checking $URL"
          for i in {1..8}; do
            if curl -fsSIL --resolve "${{ env.WEB_HOSTNAME }}:443:${VPS_IP}" "$URL"; then
              echo "✅ Smoke test passed"; exit 0
            fi
            echo "⏳ Waiting and retrying ($i/8)..."; sleep 5
          done
          echo "::error::❌ Smoke test failed: file not reachable"; exit 1

      # ---------- Email Notification ----------
      - name: 🔐 Decide if SMTP step should run
        env:
          SMTP_HOST:     ${{ secrets.SMTP_HOST }}
          SMTP_PORT_SEC: ${{ secrets.SMTP_PORT }}
          SMTP_USER:     ${{ secrets.SMTP_USERNAME }}
          SMTP_PASS:     ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM_SEC: ${{ secrets.MAIL_FROM }}
          MAIL_TO_SEC:   ${{ secrets.MAIL_TO }}
        run: |
          set -e
          if [ -n "${SMTP_HOST}" ] && [ -n "${SMTP_PORT_SEC}" ] && \
             [ -n "${SMTP_USER}" ] && [ -n "${SMTP_PASS}" ] && \
             [ -n "${MAIL_FROM_SEC}" ] && [ -n "${MAIL_TO_SEC}" ]; then
            echo "HAS_SMTP=true" >> "$GITHUB_ENV"
            echo "SMTP_PORT=${SMTP_PORT_SEC}" >> "$GITHUB_ENV"
          else
            echo "HAS_SMTP=false" >> "$GITHUB_ENV"
          fi

      - name: ✉️ Send deploy email
        if: env.HAS_SMTP == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}      # qram.quscitech.com
          server_port:    ${{ env.SMTP_PORT }}
          username:       ${{ secrets.SMTP_USERNAME }}
          password:       ${{ secrets.SMTP_PASSWORD }}
          from:           ${{ secrets.MAIL_FROM }}
          to:             ${{ secrets.MAIL_TO }}
          subject: "✅ Public Deploy Completed — ${{ github.repository }} @ ${{ github.sha }}"
          secure: ${{ env.SMTP_PORT == '465' }}  # STARTTLS if 587
          body: |
            ✅ Public deployment completed successfully
            🔗 Host: ${{ secrets.SFTP_HOST_PUBLIC }}
            📂 Remote path: /home/quscitech/public_html/instructors/QST-INST-2025/resources/
            🔎 Smoke test URL: https://${{ env.WEB_HOSTNAME }}/${{ env.SMOKE_PATH }}
            🧠 Repo: ${{ github.repository }}
            🧩 Commit: ${{ github.sha }}
            👤 By: ${{ github.actor }}


