name: Access Request Triage

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  triage:
    if: >
      (github.event.action == 'opened' &&
       contains(join(github.event.issue.labels.*.name, ','), 'access-request')) ||
      (github.event.action == 'labeled' &&
       github.event.label.name == 'access-request')
    runs-on: ubuntu-latest
    steps:
      - name: Assign, label, and comment
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.issue.number;
            const requester = context.payload.issue.user.login;

            // Add helper label
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['needs-verification'] }).catch(()=>{});

            // Assign to maintainer
            await github.rest.issues.addAssignees({ owner, repo, issue_number, assignees: ['jopaneur'] }).catch(()=>{});

            // Checklist comment
            const body = `
Hi @jopaneur — new **Private Labs access request** from @${requester}.

### Maintainer Checklist
- [ ] Verify **purchase identifier** (KDP receipt / order #)
- [ ] Confirm **GitHub username** matches requester
- [ ] Confirm **email** (if provided)
- [ ] Validate **requested scope** (E.1–E.3 Full / E.2–E.3 / Course adoption)
- [ ] Decision:
  - [ ] Approved
  - [ ] Needs more info (ask clarifying questions)
  - [ ] Declined (note reason)
- [ ] If approved: **Invite to private repo** \`quscitech-labs-full\`
  - [ ] Invitation sent
  - [ ] Access confirmed by requester
- [ ] Close issue when complete

**Quick links**
- Private repo (about): https://github.com/jopaneur/quscitech-labs-full
- Zenodo concept DOI: https://doi.org/10.5281/zenodo.17212825

<sub>_Auto-generated by Access Request Triage._</sub>`;
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
